name: PR CI
run-name: 'PR CI #${{ github.event.pull_request.number || inputs.pr_number }}'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to build'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build PR APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
              throw new Error('pr_number must be a positive integer');
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER),
            });
            if (pr.state !== 'open' || pr.mergeable === false) {
              throw new Error('PR must be open and mergeable');
            }
            // A PR's base.sha can predate subsequent pushes to its base branch.
            const { data: base } = await github.rest.repos.getBranch({
              ...context.repo, branch: pr.base.ref,
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', base.commit.sha);
            core.setOutput('ref', `refs/pull/${pr.number}/merge`);

      - name: Checkout PR merge
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check PR revision
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # PR code may read caches, but must never poison the release build cache.
      - name: Restore Gradle dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android tools
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          mkdir -p tools/bin
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o tools/bin/apktool.jar
          chmod +x gradlew

      - name: Test gesture gate and build tooling
        run: python3 -m unittest discover -s tests -v

      - name: Test app
        run: ./gradlew :bridge:testReleaseUnitTest -Phyperportal.unsigned=true

      - name: Build unsigned APKs without R8
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: python3 tools/build.py all --unsigned

      - name: Record build revision
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          info = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'pr_number': int(os.environ['PR_NUMBER']),
              'head_sha': os.environ['PR_HEAD_SHA'],
              'base_sha': os.environ['PR_BASE_SHA'],
              'merge_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'r8': False,
          }
          Path('dist/build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY

      - name: Upload unsigned APKs for trusted signing
        uses: actions/upload-artifact@v4
        with:
          name: hyperportal-pr-${{ steps.pr.outputs.number }}-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/HyperPortal-unsigned.apk
            dist/ContentCatcher-unsigned.apk
            dist/build-info.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload app test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 7
