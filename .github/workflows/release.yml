name: Release HyperPortal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to build and publish (e.g. v0.1.5)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Validate Release Version and Notes
        id: release
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('bridge/build.gradle.kts').read_text(encoding='utf-8')
          version = re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1)
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match the app version')
          notes = Path(f'docs/release-notes-{version}.md')
          if not notes.is_file():
              raise SystemExit(f'Missing release notes: {notes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\nnotes={notes.as_posix()}\n')
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Wrapper and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android NDK and Tools
        run: |
          # Use the SDK packages supported by sdkmanager in the successful
          # 0.1.4 release. Gradle resolves the project's compileSdk separately.
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Download Apktool
        run: |
          mkdir -p tools/bin
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o tools/bin/apktool.jar

      - name: Setup Release Keystore & Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p .sign
          echo "$KEYSTORE_B64" | base64 -d > .sign/my-release-key.jks
          python3 -c "
          import os
          with open('.sign/qianming.txt', 'w', encoding='utf-8') as f:
              f.write(f'ALIAS\n{os.environ[\"KEY_ALIAS\"]}\nKEY_PASSWORD\n{os.environ[\"KEY_PASSWORD\"]}\nKEYSTORE_PASSWORD\n{os.environ[\"KEYSTORE_PASSWORD\"]}\n')
          "

      - name: Grant Execute Permissions
        run: chmod +x gradlew

      - name: Test Gesture Gate and Build Cache
        run: python3 -m unittest discover -s tests -v

      - name: Build HyperPortal & AES Hook (R8 Enabled)
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          python3 tools/build.py all --r8

      - name: Prepare Release Artifacts
        run: |
          cp dist/HyperPortal-r8.apk dist/HyperPortal.apk
          cp dist/ContentCatcher-patched.apk dist/AES-patched.apk
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs dist/HyperPortal.apk
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs dist/AES-patched.apk
          ls -lh dist/

      - name: Preserve R8 Mapping
        uses: actions/upload-artifact@v4
        with:
          name: hyperportal-r8-mapping-${{ env.RELEASE_TAG }}
          path: bridge/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/HyperPortal.apk
            dist/AES-patched.apk
          name: HyperPortal ${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.notes }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
