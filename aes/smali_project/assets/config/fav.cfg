########## 说明 ##########

# {{{INTENT_DATA}}} ==> 表示从 intent 获取 data 当成 url
# {{{WEB_VIEW}}} ==> 表示从 web view 获取 url
# {{{TEXT_VIEW}}} ==> 表示从 text view 获取 text
# {{{TITLE_VIEW}}} ==> 表示从 title view 获取标题
# {{{AUTHOR_VIEW}}} ==> 表示从 author view 获取作者
# {{{bundleKey}}} ==> bundleKey 表示使用 bundle 中 bundleKey 对应的值来替换
# {{{bundleKey///subKey}}} ==> bundleKey 表示使用 bundle 中 bundleKey对应的值来替换，subKey 表示使用嵌套的 bundle 或者 json 中 subKey 对应的值来替换
# {{{bundleKey~~~news_(\d+)}}} ==> bundleKey 表示使用 bundle 中 bundleKey 对应的值后再通过正则匹配的首个捕获组来替换，注意正则表达式中类似？这样的元字符需要\?解引用

# matchVersionName: 6.5.4 ==> matchVersionName 表示匹配的应用版本，每次获取配置的时候会匹配下当前应用版本，如果不匹配则有警告，但仍返回应用配置，避免应用升级配置未更新无法收藏
# matchId: button_like ==> matchId 表示匹配控件ID
# matchText: 收藏 ==> matchText 表示匹配控件的文本
# matchLevel: include_sibling ==> matchLevel 为 include_sibling 时表示匹配兄弟控件及其子控件（例如腾讯新闻），默认只匹配当前控件及其子控件

# targetUrl ==> 收藏目标 url
# targetData ==> 收藏对应的 intentData
# targetTitle ==> 收藏内容标题
# targetImage ==> 收藏内容图片

